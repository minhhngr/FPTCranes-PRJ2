[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E402", "I"]
fixable = ["ALL"]

[tool.ruff.lint.per-file-ignores]
"pipeline.py" = ["E402"]
"streamlit.py" = ["E402"]
"validate_release.py" = ["E402"]
"tests/test_release_contract.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
